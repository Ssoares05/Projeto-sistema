<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaria</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body class="corpo">

  <main class="main-container">
    
    <header class="titulo">
        <h2>Sistema de Avaria</h2>
    </header>

    <section class="filiais">
        <label for="filial-select">AFILIAL</label>
        <select id="filial-select">
            <option value="maranhao">MARANHÃO</option>
            <option value="sao-paulo">SÃO PAULO</option>
            <option value="rio-de-janeiro">RIO DE JANEIRO</option>
            <option value="brasilia">BRASÍLIA</option>
            <option value="salvador">SALVADOR</option>
            <option value="fortaleza">FORTALEZA</option>
            <option value="curitiba">CURITIBA</option>
            <option value="parana">PARANÁ</option>
            <option value="mato-grosso">MATO GROSSO</option>
            <option value="minas-gerais">MINAS GERAIS</option>
            <option value="rio-grande">RIO GRANDE DO SUL</option>
        </select>
    </section>

    <section class="tabela">
        <div class="grupo-input">
            <label for="motorista">Motorista</label>
            <input type="text" placeholder="Nome do Motorista" maxlength="50" inputmode="text">
        </div>
        <div class="grupo-input">
            <label for="placa">Placa</label>
            <input type="text" placeholder="ABC-1234" maxlength="7" inputmode="text">
        </div>
        <div class="grupo-input">
            <label for="cliente">Cliente</label>
            <input type="text" placeholder="Nome do Cliente" maxlength="50" inputmode="text">
        </div>
        <div class="grupo-input">
            <label for="CT-e">CT-e</label>
            <input type="text" placeholder="Numero do CT-e" maxlength="44" inputmode="numeric">
        </div>
        <div class="grupo-input">
            <label for="nota-fiscal">Nota Fiscal</label>
            <input type="text" placeholder="Numero da Nota Fiscal" maxlength="44" inputmode="numeric">
        </div>
        <div class="grupo-input">
            <label for="cnpj">CNPJ</label>
            <input type="text" placeholder="00.000.000/0000-00" maxlength="14" inputmode="numeric">
        </div>
        <div class="grupo-input">
            <label for="data">Data</label>
            <input type="date">
        </div>
        
        <!-- A MUDANÇA 1: Onde a mensagem vai aparecer (dentro da tabela) -->
        <p id="mensagem-sistema"></p>
    </section>

    <div class="container-botoes">
        <!-- A MUDANÇA 2: Nomes corrigidos sem 'ç' e 'ã' para conversarem com o script.js -->
        <button onclick="filtrarVerificacao()" id="botao-filtrar">FILTRAR</button>
        <button onclick="limparVerificacao()" id="botao-limpar">LIMPAR</button>
        <button onclick="cadastrarVerificacao()" id="botao-cadastrar">CADASTRO</button>
        <button onclick="anexarVerificacao()" id="botao-anexar">ANEXAR</button>
    </div>

    <footer class="container-footer">
        <p>&copy; Sistema de Avaria</p>
        <p>&reg; Direitos Autorais Reservados 2026</p>
        <p>&reg; Desenvolvedor: Matheus Soares</p>
    </footer>

  </main>
</body>
</html>
