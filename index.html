<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaria</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body class="corpo">

  <main class="main-container">
    
    <header class="titulo">
        <h2>Sistema de Avaria</h2>
    </header>

    <section class="filiais">
        <label for="filial-select">AFILIAL</label>
        <select id="filial-select">
            <option value="maranhao">MARANHÃO</option>
            <option value="sao-paulo">SÃO PAULO</option>
            <option value="rio-de-janeiro">RIO DE JANEIRO</option>
            <option value="brasilia">BRASÍLIA</option>
            <option value="salvador">SALVADOR</option>
            <option value="fortaleza">FORTALEZA</option>
            <option value="curitiba">CURITIBA</option>
            <option value="parana">PARANÁ</option>
            <option value="mato-grosso">MATO GROSSO</option>
            <option value="minas-gerais">MINAS GERAIS</option>
            <option value="rio-grande">RIO GRANDE DO SUL</option>
            </select>
    </section>

    <section class="tabela">
        <div class="grupo-input">
            <label>Motorista</label>
            <input type="text">
            </div>
        <div class="grupo-input">
            <label>Placa</label>
            <input type="text">
        </div>
        <div class="grupo-input">
            <label>Cliente</label>
            <input type="text">
        </div>
        <div class="grupo-input">
            <label>CT-e</label>
            <input type="text">
        </div>
        <div class="grupo-input">
            <label>Nota Fiscal</label>
            <input type="text">
        </div>
        <div class="grupo-input">
            <label>CNPJ</label>
            <input type="text">
        </div>
        <div class="grupo-input">
            <label>Data</label>
            <input type="date">
        </div>
       
    </section>

    <div class="container-botoes">
        <button type="button">FILTRAR</button>
        <button type="button">LIMPAR</button>
        <button type="button">CADASTRO</button>
        <button type="button">ANEXAR</button>
    </div>

    <footer class="container-footer">
        <p>&copy; Sistema de Avaria</p>
        <p>&reg; Direitos Autorais Reservados 2026</p>
    </footer>

  </main>
</body>
</html>
